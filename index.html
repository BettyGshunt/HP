<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Jokers Quiz for Melih</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(circle at top, #4a1520, #120508); color:#eef4f8;
         font-family: Georgia, "Times New Roman", serif; }
  .card { width:min(92vw, 560px); background:#1e0d14; border:2px solid #c9a227; border-radius:16px;
          padding:28px; box-shadow:0 0 40px rgba(201,162,39,.25); }
  h1 { margin:0 0 6px; color:#e8c547; font-size:1.7rem; text-align:center; }
  .sub { text-align:center; opacity:.8; margin-bottom:22px; }
  .progress { font-size:.9rem; opacity:.75; margin-bottom:8px; }
  .q { font-size:1.2rem; margin-bottom:18px; }
  button.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px;
               font:inherit; color:#eef4f8; background:#3a1622; border:1px solid #b0394f;
               border-radius:10px; cursor:pointer; transition:.15s; }
  button.opt:hover:not(:disabled) { background:#52202f; }
  button.opt.right { background:#1f5b3a; border-color:#3fbf7a; }
  button.opt.wrong { background:#6b1f2a; border-color:#d9475b; }
  .fb { min-height:1.4em; margin:12px 0; font-style:italic; }
  .next, .restart { margin-top:8px; padding:10px 20px; font:inherit; background:#c9a227; color:#1e0d14;
                    border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  .center { text-align:center; }
  .big { font-size:3rem; margin:10px 0; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const questions = [
  { q: "Who created Balatro?", a: ["Supergiant Games", "LocalThunk", "ConcernedApe", "Mega Crit"], c: 1,
    f: "LocalThunk – a solo developer from Canada. Playstack published it." },
  { q: "How many Joker slots do you start a run with?", a: ["3", "4", "5", "6"], c: 2,
    f: "5 Joker slots – a Negative Joker gives you one more." },
  { q: "What does the basic \"Joker\" card give you?", a: ["+4 Mult", "+30 Chips", "X2 Mult", "$4 per round"], c: 0,
    f: "+4 Mult – simple but useful early on." },
  { q: "What does Blueprint do?", a: ["Copies the Joker to its right", "Copies the leftmost Joker", "Doubles all your Chips", "Creates a Tarot card"], c: 0,
    f: "Blueprint copies the ability of the Joker to its right." },
  { q: "And what does Brainstorm copy?", a: ["The Joker to its right", "The leftmost Joker", "The last Joker you bought", "A random Joker"], c: 1,
    f: "Brainstorm copies your leftmost Joker – combine it with Blueprint for big combos!" },
  { q: "What can happen to Gros Michel at the end of a round?", a: ["It doubles its Mult", "It turns into gold", "It can go extinct (1 in 6 chance)", "It becomes Negative"], c: 2,
    f: "1 in 6 chance it gets destroyed – the banana goes extinct!" },
  { q: "After Gros Michel goes extinct, which Joker can show up?", a: ["Ice Cream", "Cavendish", "Popcorn", "Turtle Bean"], c: 1,
    f: "Cavendish – X3 Mult, with only a 1 in 1000 chance to be destroyed." },
  { q: "Which of these is NOT a Legendary Joker?", a: ["Perkeo", "Chicot", "Triboulet", "Blueprint"], c: 3,
    f: "Blueprint is Rare. The Legendaries are Canio, Triboulet, Yorick, Chicot and Perkeo." },
  { q: "How do you usually get a Legendary Joker?", a: ["Buy it in the shop", "From The Soul Spectral card", "Beat Ante 8", "Sell 5 Jokers"], c: 1,
    f: "The Soul – a rare Spectral card that creates a Legendary Joker." },
  { q: "What does Chicot do?", a: ["Disables every Boss Blind", "Gives X2 Mult for Kings and Queens", "Copies consumables", "Gains Mult when cards are destroyed"], c: 0,
    f: "Chicot disables the effect of every Boss Blind." },
  { q: "Which Legendary Joker makes played Kings and Queens give X2 Mult?", a: ["Canio", "Yorick", "Triboulet", "Perkeo"], c: 2,
    f: "Triboulet – the royal jester!" },
  { q: "What does a Negative edition Joker give you?", a: ["X1.5 Mult", "+50 Chips", "+1 Joker slot", "+$5 sell value"], c: 2,
    f: "+1 Joker slot – so it basically doesn't take up space." },
  { q: "What does the Egg Joker do?", a: ["Gains $3 of sell value every round", "Hatches into a Rare Joker", "Gives +10 Mult once", "Adds a card to your deck"], c: 0,
    f: "Egg gains $3 sell value at the end of every round – sell it later for cash!" }
];

let i = 0, score = 0;
const app = document.getElementById("app");

function start() {
  app.innerHTML = `
    <h1>🃏 Balatro Jokers Quiz 🃏</h1>
    <div class="sub">Made for Melih – do you know your Jokers?</div>
    <div class="center"><div class="big">🃏</div>
    <p>${questions.length} questions. Let's see that Mult!</p>
    <button class="next" onclick="show()">Start</button></div>`;
}

function show() {
  const item = questions[i];
  app.innerHTML = `
    <div class="progress">Question ${i + 1} of ${questions.length} · Score: ${score}</div>
    <div class="q">Melih, ${item.q.charAt(0).toLowerCase() + item.q.slice(1)}</div>
    ${item.a.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join("")}
    <div class="fb" id="fb"></div>
    <div id="nav"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const item = questions[i];
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[item.c].classList.add("right");
  if (k === item.c) { score++; document.getElementById("fb").textContent = "✨ Correct! " + item.f; }
  else { btns[k].classList.add("wrong"); document.getElementById("fb").textContent = "Not quite. " + item.f; }
  document.getElementById("nav").innerHTML =
    `<button class="next" onclick="next()">${i < questions.length - 1 ? "Next ➜" : "See result"}</button>`;
}

function next() { i++; i < questions.length ? show() : result(); }

function result() {
  const pct = score / questions.length;
  const title = pct === 1 ? "Gold Stake champion! 🏆"
              : pct >= .7 ? "Huge Mult! You'd beat Ante 8! 🔥"
              : pct >= .4 ? "Not bad – but the Boss Blind is waiting! 🎲"
              : "Game over on Ante 1 – shuffle and try again, Melih! 🃏";
  app.innerHTML = `
    <h1>Well done, Melih!</h1>
    <div class="center"><div class="big">${score} / ${questions.length}</div>
    <p>${title}</p>
    <button class="restart" onclick="i=0;score=0;start()">Play again</button></div>`;
}

start();
</script>
</body>
</html>
