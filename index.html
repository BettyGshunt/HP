<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harry Potter Quiz for Melih</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(circle at top, #2a1f4d, #0d0a1a); color:#f3e9c6;
         font-family: Georgia, "Times New Roman", serif; }
  .card { width:min(92vw, 560px); background:#1b1433; border:2px solid #c9a227; border-radius:16px;
          padding:28px; box-shadow:0 0 40px rgba(201,162,39,.25); }
  h1 { margin:0 0 6px; color:#e8c547; font-size:1.7rem; text-align:center; }
  .sub { text-align:center; opacity:.8; margin-bottom:22px; }
  .progress { font-size:.9rem; opacity:.75; margin-bottom:8px; }
  .q { font-size:1.2rem; margin-bottom:18px; }
  button.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px;
               font:inherit; color:#f3e9c6; background:#2a2050; border:1px solid #5b4b8a;
               border-radius:10px; cursor:pointer; transition:.15s; }
  button.opt:hover:not(:disabled) { background:#3a2d6b; }
  button.opt.right { background:#1f5b3a; border-color:#3fbf7a; }
  button.opt.wrong { background:#6b1f2a; border-color:#d9475b; }
  .fb { min-height:1.4em; margin:12px 0; font-style:italic; }
  .next, .restart { margin-top:8px; padding:10px 20px; font:inherit; background:#c9a227; color:#1b1433;
                    border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  .center { text-align:center; }
  .big { font-size:3rem; margin:10px 0; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const questions = [
  { q: "Which of these was NOT one of Voldemort's Horcruxes?", a: ["Hufflepuff's Cup", "Ravenclaw's Diadem", "Gryffindor's Sword", "Slytherin's Locket"], c: 2,
    f: "Gryffindor's Sword – it was actually used to DESTROY Horcruxes." },
  { q: "What form does Hermione's Patronus take?", a: ["A hare", "An otter", "A Jack Russell terrier", "A doe"], c: 1,
    f: "An otter. (Luna's is a hare, Ron's a terrier, Snape's a doe.)" },
  { q: "What is the core of Harry's wand?", a: ["Dragon heartstring", "Unicorn hair", "Phoenix feather", "Thestral tail hair"], c: 2,
    f: "Phoenix feather – from Fawkes, the same phoenix that gave a feather for Voldemort's wand." },
  { q: "What is Dumbledore's full name?", a: ["Albus Percival Wulfric Brian Dumbledore", "Albus Brian Aberforth Dumbledore", "Albus Wulfric Gellert Dumbledore", "Albus Percival Ignotus Dumbledore"], c: 0,
    f: "Albus Percival Wulfric Brian Dumbledore." },
  { q: "Who kills Bellatrix Lestrange in the Battle of Hogwarts?", a: ["Neville Longbottom", "Hermione Granger", "Minerva McGonagall", "Molly Weasley"], c: 3,
    f: "Molly Weasley – defending her daughter Ginny." },
  { q: "What is the name of the Black family's house-elf?", a: ["Winky", "Hokey", "Kreacher", "Dobby"], c: 2,
    f: "Kreacher. (Dobby served the Malfoys, Winky the Crouches, Hokey Hepzibah Smith.)" },
  { q: "What was the name of Voldemort's mother?", a: ["Eileen Prince", "Merope Gaunt", "Ariana Dumbledore", "Kendra Gaunt"], c: 1,
    f: "Merope Gaunt – a descendant of Salazar Slytherin." },
  { q: "Which professional Quidditch team does Ginny play for?", a: ["Chudley Cannons", "Puddlemere United", "Holyhead Harpies", "Montrose Magpies"], c: 2,
    f: "The Holyhead Harpies – an all-female team." },
  { q: "What does Dumbledore tell Harry he sees in the Mirror of Erised?", a: ["His family", "The Elder Wand", "A pair of thick woollen socks", "Himself as Minister for Magic"], c: 2,
    f: "Woollen socks – \"One can never have enough socks.\" (Probably not the whole truth!)" },
  { q: "How many points is catching the Golden Snitch worth?", a: ["50", "100", "150", "200"], c: 2,
    f: "150 points – and it ends the match." },
  { q: "What is the address of the Order of the Phoenix headquarters?", a: ["4 Privet Drive", "12 Grimmauld Place", "Spinner's End", "Shell Cottage"], c: 1,
    f: "Number 12, Grimmauld Place, London – Sirius Black's family home." },
  { q: "Who originally made Harry's Invisibility Cloak, according to the Tale of the Three Brothers?", a: ["Antioch Peverell", "Cadmus Peverell", "Ignotus Peverell", "Godric Gryffindor"], c: 2,
    f: "Ignotus Peverell – Harry is his descendant." }
];

let i = 0, score = 0;
const app = document.getElementById("app");

function start() {
  app.innerHTML = `
    <h1>⚡ Harry Potter Quiz: Hard Mode ⚡</h1>
    <div class="sub">Made for Melih – HARD MODE. Only true wizards survive!</div>
    <div class="center"><div class="big">🧙‍♂️</div>
    <p>${questions.length} questions. Good luck!</p>
    <button class="next" onclick="show()">Start</button></div>`;
}

function show() {
  const item = questions[i];
  app.innerHTML = `
    <div class="progress">Question ${i + 1} of ${questions.length} · Score: ${score}</div>
    <div class="q">${item.q}</div>
    ${item.a.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join("")}
    <div class="fb" id="fb"></div>
    <div id="nav"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const item = questions[i];
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[item.c].classList.add("right");
  if (k === item.c) { score++; document.getElementById("fb").textContent = "✨ Correct! " + item.f; }
  else { btns[k].classList.add("wrong"); document.getElementById("fb").textContent = "Not quite. " + item.f; }
  document.getElementById("nav").innerHTML =
    `<button class="next" onclick="next()">${i < questions.length - 1 ? "Next ➜" : "See result"}</button>`;
}

function next() { i++; i < questions.length ? show() : result(); }

function result() {
  const pct = score / questions.length;
  const title = pct === 1 ? "Order of Merlin, First Class! 🏆"
              : pct >= .7 ? "Excellent wizard! 🦉"
              : pct >= .4 ? "Good job, keep practising your spells! 🪄"
              : "Even Neville started somewhere – try again! 🐸";
  app.innerHTML = `
    <h1>Well done, Melih!</h1>
    <div class="center"><div class="big">${score} / ${questions.length}</div>
    <p>${title}</p>
    <button class="restart" onclick="i=0;score=0;start()">Play again</button></div>`;
}

start();
</script>
</body>
</html>
