<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Set 18 Quiz for Melih</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(circle at top, #1f4d2e, #06140b); color:#eef4f8;
         font-family: Georgia, "Times New Roman", serif; }
  .card { width:min(92vw, 560px); background:#0f2416; border:2px solid #c9a227; border-radius:16px;
          padding:28px; box-shadow:0 0 40px rgba(201,162,39,.25); }
  h1 { margin:0 0 6px; color:#e8c547; font-size:1.7rem; text-align:center; }
  .sub { text-align:center; opacity:.8; margin-bottom:22px; }
  .progress { font-size:.9rem; opacity:.75; margin-bottom:8px; }
  .q { font-size:1.2rem; margin-bottom:18px; }
  button.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px;
               font:inherit; color:#eef4f8; background:#1a3a24; border:1px solid #3f8a55;
               border-radius:10px; cursor:pointer; transition:.15s; }
  button.opt:hover:not(:disabled) { background:#255233; }
  button.opt.right { background:#1f5b3a; border-color:#3fbf7a; }
  button.opt.wrong { background:#6b1f2a; border-color:#d9475b; }
  .fb { min-height:1.4em; margin:12px 0; font-style:italic; }
  .next, .restart { margin-top:8px; padding:10px 20px; font:inherit; background:#c9a227; color:#0f2416;
                    border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  .center { text-align:center; }
  .big { font-size:3rem; margin:10px 0; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const questions = [
  { q: "What is the name of TFT Set 18?", a: ["Space Gods", "Lore & Legends", "Enchanted Wilds", "Magic n' Mayhem"], c: 2,
    f: "Enchanted Wilds – a magical forest full of beasts and spirits." },
  { q: "What is the set mechanic of Enchanted Wilds called?", a: ["Charms", "Wisps", "Portals", "Encounters"], c: 1,
    f: "Wisps – little magic sprites that show up in your shop." },
  { q: "Wisps are a comeback of which mechanic from Set 12 (Magic n' Mayhem)?", a: ["Charms", "Augments", "Anomalies", "Hextech Gates"], c: 0,
    f: "Charms! Riot brought them back and renamed them Wisps." },
  { q: "How many Wisps can you buy per round?", a: ["1", "2", "3", "As many as you can afford"], c: 0,
    f: "Only 1 per round – so choose wisely!" },
  { q: "In which shop slot does a Wisp appear?", a: ["The leftmost slot", "The middle slot", "The rightmost slot", "A random slot"], c: 2,
    f: "The rightmost slot, in every other shop – it covers up the champion behind it." },
  { q: "Which trait makes your Wisps stronger?", a: ["Blossom", "Coven", "Fae", "Inferno"], c: 0,
    f: "Blossom – after combat, your Wisps get empowered." },
  { q: "With which trait can you get the Elder Dragon?", a: ["Primal", "Riftbeast", "Monolith", "Old Growth"], c: 1,
    f: "Riftbeast – and the Elder Dragon (Apex Predator) takes up 2 team slots!" },
  { q: "Which 5-cost champion comes in three different versions?", a: ["Ashe", "Gnar", "Kennen", "Lux"], c: 3,
    f: "Lux – as Blackthorn, Blossom or Coven. She's an Avatar and counts twice for her trait." },
  { q: "Which 5-cost champion has his very own trait called Greenfather?", a: ["Ivern", "Draven", "Gnar", "Alune"], c: 0,
    f: "Ivern – his seeds grow special hexes that boost whoever stands on them." },
  { q: "Which champion is the Bounty Seeker who completes bounties for rewards?", a: ["Ashe", "Draven", "Kennen", "Kha'Zix"], c: 1,
    f: "Draven – choose a bounty and he works on it to earn you loot." },
  { q: "What does the Eclipse trait do?", a: ["Gives your team a big shield", "Kills the lowest-Health enemy every few seconds", "Doubles your gold", "Freezes all enemies"], c: 1,
    f: "After 10 seconds of combat, Eclipse executes the lowest-Health enemy over and over!" },
  { q: "Which trait gives you plants you can place on the board?", a: ["Greenfather", "Thornmaiden", "Elderwood", "Flora Fatalis"], c: 2,
    f: "Elderwood – the plants get stronger at higher trait levels." },
  { q: "Which classic mechanic came back in Set 18 after Set 17 changed it?", a: ["The Carousel", "The Armory", "Hyper Roll", "Double Up"], c: 0,
    f: "The Carousel – pick a champion with an item, lowest health first!" }
];

let i = 0, score = 0;
const app = document.getElementById("app");

function start() {
  app.innerHTML = `
    <h1>🌿 TFT Set 18: Enchanted Wilds Quiz 🌿</h1>
    <div class="sub">Made for Melih – are you a Challenger player?</div>
    <div class="center"><div class="big">🧚</div>
    <p>${questions.length} questions. GL HF!</p>
    <button class="next" onclick="show()">Start</button></div>`;
}

function show() {
  const item = questions[i];
  app.innerHTML = `
    <div class="progress">Question ${i + 1} of ${questions.length} · Score: ${score}</div>
    <div class="q">Melih, ${item.q.charAt(0).toLowerCase() + item.q.slice(1)}</div>
    ${item.a.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join("")}
    <div class="fb" id="fb"></div>
    <div id="nav"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const item = questions[i];
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[item.c].classList.add("right");
  if (k === item.c) { score++; document.getElementById("fb").textContent = "✨ Correct! " + item.f; }
  else { btns[k].classList.add("wrong"); document.getElementById("fb").textContent = "Not quite. " + item.f; }
  document.getElementById("nav").innerHTML =
    `<button class="next" onclick="next()">${i < questions.length - 1 ? "Next ➜" : "See result"}</button>`;
}

function next() { i++; i < questions.length ? show() : result(); }

function result() {
  const pct = score / questions.length;
  const title = pct === 1 ? "Challenger! You're the best in the lobby! 🏆"
              : pct >= .7 ? "Diamond – top 4 every game! 💎"
              : pct >= .4 ? "Gold – solid, keep climbing! 🥇"
              : "Iron for now – one more game, Melih! 🐧";
  app.innerHTML = `
    <h1>Well done, Melih!</h1>
    <div class="center"><div class="big">${score} / ${questions.length}</div>
    <p>${title}</p>
    <button class="restart" onclick="i=0;score=0;start()">Play again</button></div>`;
}

start();
</script>
</body>
</html>
