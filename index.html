<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Quiz for Melih</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(circle at top, #10334d, #050d18); color:#eef4f8;
         font-family: Georgia, "Times New Roman", serif; }
  .card { width:min(92vw, 560px); background:#0c1d2e; border:2px solid #c9a227; border-radius:16px;
          padding:28px; box-shadow:0 0 40px rgba(201,162,39,.25); }
  h1 { margin:0 0 6px; color:#e8c547; font-size:1.7rem; text-align:center; }
  .sub { text-align:center; opacity:.8; margin-bottom:22px; }
  .progress { font-size:.9rem; opacity:.75; margin-bottom:8px; }
  .q { font-size:1.2rem; margin-bottom:18px; }
  button.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px;
               font:inherit; color:#eef4f8; background:#14304a; border:1px solid #2f6a92;
               border-radius:10px; cursor:pointer; transition:.15s; }
  button.opt:hover:not(:disabled) { background:#1d4466; }
  button.opt.right { background:#1f5b3a; border-color:#3fbf7a; }
  button.opt.wrong { background:#6b1f2a; border-color:#d9475b; }
  .fb { min-height:1.4em; margin:12px 0; font-style:italic; }
  .next, .restart { margin-top:8px; padding:10px 20px; font:inherit; background:#c9a227; color:#0c1d2e;
                    border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  .center { text-align:center; }
  .big { font-size:3rem; margin:10px 0; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const questions = [
  { q: "Which company makes Teamfight Tactics?", a: ["Blizzard", "Riot Games", "Valve", "Supercell"], c: 1,
    f: "Riot Games – the same studio that makes League of Legends." },
  { q: "How many players are in a normal TFT lobby?", a: ["4", "6", "8", "10"], c: 2,
    f: "8 players – only one can finish 1st!" },
  { q: "How much gold does a shop reroll cost?", a: ["1 gold", "2 gold", "3 gold", "4 gold"], c: 1,
    f: "2 gold per reroll." },
  { q: "How much gold do you pay to buy 4 XP?", a: ["2 gold", "4 gold", "5 gold", "10 gold"], c: 1,
    f: "4 gold for 4 XP." },
  { q: "What is the maximum interest you can earn per round?", a: ["3 gold", "5 gold", "10 gold", "There is no limit"], c: 1,
    f: "5 gold – you get 1 gold for every 10 gold you hold, up to 50 gold." },
  { q: "How many 1-star copies of a champion do you need to make a 3-star?", a: ["3", "6", "9", "12"], c: 2,
    f: "9 copies: 3 one-stars make a two-star, and 3 two-stars make a three-star." },
  { q: "What is the most items one champion can hold?", a: ["2", "3", "4", "6"], c: 1,
    f: "3 items per champion." },
  { q: "What do you get when you combine two B.F. Swords?", a: ["Infinity Edge", "Bloodthirster", "Deathblade", "Giant Slayer"], c: 2,
    f: "Deathblade – pure attack damage." },
  { q: "What do you get when you combine two Tears of the Goddess?", a: ["Blue Buff", "Spear of Shojin", "Archangel's Staff", "Rabadon's Deathcap"], c: 0,
    f: "Blue Buff – great for champions who cast a lot." },
  { q: "What is the little creature that walks around your board called?", a: ["A Poro", "A Little Legend", "A Minion", "A Tactician Pet"], c: 1,
    f: "A Little Legend – like Pengu, River Sprite or Featherknight." },
  { q: "What is the round called where everyone picks a champion with an item from a spinning circle?", a: ["The Shop", "The Arena", "The Carousel", "The Augment round"], c: 2,
    f: "The Carousel (also called the shared draft) – lowest health picks first!" },
  { q: "In which set were Augments first added to TFT?", a: ["Set 1: Faction Wars", "Set 3: Galaxies", "Set 6: Gizmos & Gadgets", "Set 9: Runeterra Reforged"], c: 2,
    f: "Set 6: Gizmos & Gadgets in 2021 – and they've been in the game ever since." }
];

let i = 0, score = 0;
const app = document.getElementById("app");

function start() {
  app.innerHTML = `
    <h1>🐧 Teamfight Tactics Quiz 🐧</h1>
    <div class="sub">Made for Melih – are you a Challenger player?</div>
    <div class="center"><div class="big">⚔️</div>
    <p>${questions.length} questions. GL HF!</p>
    <button class="next" onclick="show()">Start</button></div>`;
}

function show() {
  const item = questions[i];
  app.innerHTML = `
    <div class="progress">Question ${i + 1} of ${questions.length} · Score: ${score}</div>
    <div class="q">Melih, ${item.q.charAt(0).toLowerCase() + item.q.slice(1)}</div>
    ${item.a.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join("")}
    <div class="fb" id="fb"></div>
    <div id="nav"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const item = questions[i];
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[item.c].classList.add("right");
  if (k === item.c) { score++; document.getElementById("fb").textContent = "✨ Correct! " + item.f; }
  else { btns[k].classList.add("wrong"); document.getElementById("fb").textContent = "Not quite. " + item.f; }
  document.getElementById("nav").innerHTML =
    `<button class="next" onclick="next()">${i < questions.length - 1 ? "Next ➜" : "See result"}</button>`;
}

function next() { i++; i < questions.length ? show() : result(); }

function result() {
  const pct = score / questions.length;
  const title = pct === 1 ? "Challenger! You're the best in the lobby! 🏆"
              : pct >= .7 ? "Diamond – top 4 every game! 💎"
              : pct >= .4 ? "Gold – solid, keep climbing! 🥇"
              : "Iron for now – one more game, Melih! 🐧";
  app.innerHTML = `
    <h1>Well done, Melih!</h1>
    <div class="center"><div class="big">${score} / ${questions.length}</div>
    <p>${title}</p>
    <button class="restart" onclick="i=0;score=0;start()">Play again</button></div>`;
}

start();
</script>
</body>
</html>
